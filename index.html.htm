<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>اختبار الوحدة السابعة</title>
    <style>
        :root {
            --board-green: #1b3022;
            --chalk-white: #fefefe;
            --correct-green: #2ecc71;
            --wrong-red: #e74c3c;
            --button-hover: #2d5a3d;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--board-green);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--chalk-white);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* تصميم السبورة */
        .chalkboard {
            width: 100vw;
            height: 100vh;
            background: var(--board-green);
            background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .container {
            max-width: 800px;
            width: 90%;
            text-align: center;
            padding: 20px;
        }

        h1 { font-size: 2rem; margin-bottom: 10px; color: #fff; }
        .subtitle { font-size: 1.5rem; margin-bottom: 30px; }

        /* الأزرار */
        .btn {
            background: transparent;
            border: 2px solid var(--chalk-white);
            color: var(--chalk-white);
            padding: 15px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
            margin: 10px;
        }

        .btn:hover { background: rgba(255,255,255,0.1); }

        .option-btn {
            display: block;
            width: 100%;
            text-align: left;
            direction: ltr;
            margin: 10px 0;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--chalk-white);
            border-radius: 5px;
            font-size: 1.1rem;
            color: white;
            cursor: pointer;
        }

        /* الألوان عند الإجابة */
        .correct { background-color: var(--correct-green) !important; color: white; border-color: var(--correct-green); }
        .wrong { background-color: var(--wrong-red) !important; color: white; border-color: var(--wrong-red); }

        /* الملاحظات */
        .note-box {
            direction: rtl;
            background: rgba(255,255,0,0.1);
            border: 2px dashed #f1c40f;
            padding: 20px;
            margin: 20px 0;
            text-align: right;
            border-radius: 10px;
        }

        .question-text {
            font-size: 1.4rem;
            margin-bottom: 20px;
            direction: ltr;
            text-align: left;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 20px;
        }

        .hidden { display: none !important; }

        /* للهواتف */
        @media (max-width: 600px) {
            h1 { font-size: 1.5rem; }
            .btn { padding: 10px 20px; font-size: 1rem; }
        }
    </style>
</head>
<body>

<div class="chalkboard">
    <!-- الصفحة الأولى -->
    <div id="start-page" class="container">
        <h1>اختبار في اللغة الانجليزية2 ـ الوحدة السابعة</h1>
        <p class="subtitle">عدد الاسئلة: 82</p>
        <button class="btn" onclick="startQuiz()">ابدأ الاختبار</button>
    </div>

    <!-- صفحة الاختبار -->
    <div id="quiz-page" class="container hidden">
        <div id="note-container" class="note-box hidden"></div>
        <div id="question-header" style="text-align: right; margin-bottom: 10px; font-weight: bold;"></div>
        <div id="question-content" class="question-text"></div>
        <div id="options-container"></div>
        
        <div class="nav-buttons">
            <button id="prev-btn" class="btn" onclick="goBack()">السابق</button>
            <span id="progress-text" style="align-self: center;"></span>
            <button id="next-btn" class="btn hidden" onclick="goNext()">التالي</button>
        </div>
    </div>

    <!-- صفحة النتيجة -->
    <div id="result-page" class="container hidden">
        <h1>انتهى الاختبار</h1>
        <p class="subtitle">درجتك هي: <span id="score-display"></span> / 82</p>
        <button class="btn" onclick="location.reload()">إعادة الاختبار</button>
    </div>
</div>

<script>
    const quizData = [
        // 1-6
        { q: "How do we ask about the the weather?", options: ["What is the weather like?", "How is the weather?", "Was the weather?", "Like the weather?"], a: ["What is the weather like?"] },
        { q: "How do we ask about the the food?", options: ["What is the food like?", "How the food?", "What food like?", "Is food like?"], a: ["What is the food like?"] },
        { q: "How do we ask about the the people?", options: ["What are the people like?", "Who is people like?", "What people looks?", "Are people like?"], a: ["What are the people like?"] },
        { q: "How do we ask about the Rio de Janeiro?", options: ["What is Rio like?", "How is Rio?", "Rio like what?", "Is Rio good?"], a: ["What is Rio like?"] },
        { q: "How do we ask about the the nightlife?", options: ["What is the night life like?", "Is night life good?", "What night life is?", "How is night life?"], a: ["What is the night life like?"] },
        { q: "How do we ask about the the beaches?", options: ["What are the beaches like?", "How are beaches?", "What beaches like?", "Is beaches like?"], a: ["What are the beaches like?"] },
        // 7-11
        { q: "A : What ..... like? B : Awful. The plane was five hours late.", options: ["was the journey", "is the journey", "did the journey", "were the journey"], a: ["was the journey"] },
        { q: "A : ____ like the hotel? B : No, it was terrible.", options: ["Did you", "Was you", "Were you", "Do you"], a: ["Did you"] },
        { q: "A : What ____ like? B : Disgusting! Chips with everything.", options: ["was the food", "is the food", "did the food", "were the food"], a: ["was the food"] },
        { q: "A : ____ like the town? B : No, it was boring.", options: ["Did you", "Was you", "Were you", "Do you"], a: ["Did you"] },
        { q: "A : What ____ like? B : It rained every day.", options: ["was the weather", "is the weather", "did the weather", "were the weather"], a: ["was the weather"], note: "ملاحظة1 الأسئلة من 12 إلى 15 ممكن تحتمل إجابتين صحيحتين" },
        // 12-15 (Two Correct)
        { q: "What does Jaco look like?", options: ["He is taller than me!", "He is tall and slim, with short blond hair.", "He is very kind.", "He likes football."], a: ["He is taller than me!", "He is tall and slim, with short blond hair."], multi: true },
        { q: "What’s Jaco like?", options: ["He is great guy, really interesting.", "He is the funniest guy I know.", "He is tall.", "He has blonde hair."], a: ["He is great guy, really interesting.", "He is the funniest guy I know."], multi: true },
        { q: "Do you like Jaco?", options: ["Yes, he's one of my best friends!", "Yes, of course! Everybody loves Jaco!", "He likes football.", "He is interesting."], a: ["Yes, he's one of my best friends!", "Yes, of course! Everybody loves Jaco!"], multi: true },
        { q: "What does Jaco like?", options: ["He loves football and visiting other countries.", "He eats a lot of Indian food.", "He is very funny.", "He is taller than me."], a: ["He loves football and visiting other countries.", "He eats a lot of Indian food."], multi: true },
        // 16-19
        { q: "She's quite tall, pretty, and she's got long blonde hair.", options: ["What does Rita look like?", "What is Rita like?", "Does Rita like it?", "Is Rita tall?"], a: ["What does Rita look like?"] },
        { q: "‘She’s a lovely person. She’s really kind.’", options: ["What is Rita like?", "What does Rita look like?", "Does Rita look like?", "What is Rita?"], a: ["What is Rita like?"] },
        { q: "‘Playing tennis, going to the gym and cooking.’", options: ["What does Rita like?", "What is Rita like?", "Does Rita like?", "What looks Rita?"], a: ["What does Rita like?"] },
        { q: "‘Yes, I do. She’s one of the kindest people I know.’", options: ["Do you like Rita?", "Is Rita kind?", "Does Rita like you?", "What is Rita like?"], a: ["Do you like Rita?"], note: "ملاحظة2 نستخدم الصيغة What + do/does/did + S + look like ? للسؤال عن الصفات الخارجية و إذا حذفت look صار معنى السؤال ماذا يحب ؟ و نستخدم الصيغة What + be (مع تصاريفها) + S(بشر حصراً) + like للسؤال عن الصفات الداخلية" },
        // 20-25
        { q: "Her work is good. And my work is also good. Her work is .......... mine.", options: ["as good as", "better than", "the best", "good than"], a: ["as good as"] },
        { q: "Scotland is colder than England. England isn’t ........ Scotland.", options: ["as cold as", "colder than", "colder as", "cold than"], a: ["as cold as"] },
        { q: "Bill’s taller than me. I’m not ....... Bill.", options: ["as tall as", "taller than", "taller as", "tall than"], a: ["as tall as"] },
        { q: "My car cost £60,000. Her car also cost £60,000. Her car was ......... mine.", options: ["as expensive as", "more expensive", "expensive than", "as expensive than"], a: ["as expensive as"] },
        { q: "Jane’s house is older than Harry’s. Jane’s house is ...... modern ...... Harry’s.", options: ["is not as ..... as", "is as ..... as", "is more ..... than", "is not more ..... than"], a: ["is not as ..... as"] },
        { q: "Your daughter isn’t shorter than you any more! Your daughter is ....... you now!", options: ["as tall as", "taller than", "shorter than", "the tallest"], a: ["as tall as"], note: "ملاحظة3 من 26 إلى 31 سؤالهن واحد وهو : Choose the answer which disagree with these sentences." },
        // 26-31 (Disagreeing)
        { q: "Ethan is the noisiest boy in the group.", options: ["No, he isn't the quietest.", "Yes, he is.", "He is loud.", "He is quiet."], a: ["No, he isn't the quietest."] },
        { q: "She bought the cheapest bag in the shop.", options: ["No, she did not. She bought the most expensive one/bag.", "Yes, it was cheap.", "She bought a bag.", "The bag was expensive."], a: ["No, she did not. She bought the most expensive one/bag."] },
        { q: "This is the easiest exercise in the book.", options: ["No, it is not. This is the most difficult one.", "It is very easy.", "This is easy.", "It is difficult."], a: ["No, it is not. This is the most difficult one."] },
        { q: "This is the most beautiful building I’ve ever seen.", options: ["No, it is not. This is ugliest building I have ever seen.", "It is beautiful.", "I like this building.", "It is very big."], a: ["No, it is not. This is ugliest building I have ever seen."] },
        { q: "Jim is the meanest person I know.", options: ["No, it is not. He is kindest person I know.", "Jim is mean.", "He is bad.", "He is my friend."], a: ["No, it is not. He is kindest person I know."] },
        { q: "The Olive Tree is the best restaurant in town.", options: ["No, it is not. It is worst restaurants in the town.", "It is the best.", "I like food.", "The restaurant is open."], a: ["No, it is not. It is worst restaurants in the town."] },
        // 32-47 (Everest)
        { q: "Malavath Poorna was only 13 years old when she ..... Mount Everest.", options: ["climbed", "climb", "climbing", "climbs"], a: ["climbed"] },
        { q: "She is the ..... girl ever to reach the summit of the world’s ..... mountain", options: ["youngest ...... highest", "youngest ...... high", "younger ...... highest", "young ...... higher"], a: ["youngest ...... highest"] },
        { q: "Malavath .... a school for underprivileged children.", options: ["attended", "attend", "attending", "was attend"], a: ["attended"] },
        { q: "He could show India's ____ citizens that there are opportunities for everyone.", options: ["poorest", "poorer", "poor", "the poor"], a: ["poorest"] },
        { q: "By making a farmer's daughter into one of India's ____ climbers.", options: ["best", "good", "better", "the best"], a: ["best"] },
        { q: "Malavath was ____ at sports than a lot of the other students.", options: ["better", "good", "best", "more good"], a: ["better"] },
        { q: "She is ____ ,so she was one of two students chosen for the Everest climb.", options: ["fitter", "fit", "fittest", "more fit"], a: ["fitter"] },
        { q: "She knew nothing about climbing before she ..... the training.", options: ["began", "begin", "begun", "begins"], a: ["began"] },
        { q: "She was going to climb the ____ famous mountain in the world.", options: ["most", "more", "much", "very"], a: ["most"] },
        { q: "The training was a lot ____ than she expected.", options: ["harder", "hard", "hardest", "more hard"], a: ["harder"] },
        { q: "The ____ moment for Malavath was when they found six dead bodies.", options: ["most frightening", "more frightening", "frightening", "frightened"], a: ["most frightening"] },
        { q: "‘I was scared,’ she says, but then she ........ her school motto.", options: ["remembered", "remember", "remembers", "forget"], a: ["remembered"] },
        { q: "Malavath has also climbed Africa’s__ mountain.", options: ["tallest", "taller", "tall", "the taller"], a: ["tallest"] },
        { q: "Indian girls can be..... the boys - or even __!", options: ["as good as ..... better", "as better as ..... good", "better as ..... good", "good as ..... better"], a: ["as good as ..... better"] },
        { q: "The film about Malavath’s journey to Everest is .... Poorna.", options: ["called", "call", "calling", "calls"], a: ["called"] },
        { q: "Malavath Poorna is the __ person I have ever met.", options: ["most remarkable", "more remarkable", "remarkable", "the remarkable"], a: ["most remarkable"] },
        // 48-60 (Vocab)
        { q: "‘This exercise is really hard.’ ‘I know, it’s too ..... for me.’", options: ["difficult", "easy", "short", "long"], a: ["difficult"] },
        { q: "‘Harry’s such a handsome young man.’ ‘I wish I was as .... as him!’", options: ["good - looking", "ugly", "small", "intelligent"], a: ["good - looking"] },
        { q: "‘Richard is really intelligent.’ ‘Yes, he’s so ......’", options: ["clever", "stupid", "bad", "slow"], a: ["clever"] },
        { q: "‘It’s strange weather for this time of year.’ ‘Yes, it is ..... .’", options: ["unusual", "normal", "hot", "cold"], a: ["unusual"] },
        { q: "‘I’m not very pleased with my new laptop.’ ‘Well, if you’re not ..... with it...’", options: ["happy", "sad", "angry", "fast"], a: ["happy"] },
        { q: "‘We had a lovely time in Florence.’ ‘Mmm, I’ve heard Tuscany is ......’", options: ["wonderful", "terrible", "boring", "bad"], a: ["wonderful"] },
        { q: "Some people are so rude! You should always be ___ to others.", options: ["polite", "bad", "noisy", "clean"], a: ["polite"] },
        { q: "This glass is dirty! Could you give me a ___ one, please?", options: ["clean", "dirty", "empty", "new"], a: ["clean"] },
        { q: "Fran thought the film was interesting, but I thought it was ..... .", options: ["boring", "good", "great", "long"], a: ["boring"] },
        { q: "I thought my answer was wrong, but the teacher said it was ..... .", options: ["correct", "bad", "right", "wrong"], a: ["correct"] },
        { q: "Why are the children so quiet? They’re usually very ..... .", options: ["noisy", "silent", "happy", "sleepy"], a: ["noisy"] },
        { q: "I’m always ....... on Monday, but then I’m really happy on Friday.", options: ["miserable", "happy", "good", "excited"], a: ["miserable"] },
        { q: "Einstein was really intelligent. I’m so ...... compared to him.", options: ["stupid", "clever", "smart", "fast"], a: ["stupid"] },
        { q: "Dubai is so expensive. Nothing is ......!", options: ["cheap", "expensive", "rich", "big"], a: ["cheap"] },
        // 61-82 (Grammar Mix)
        { q: "What .... we do today? The weather is awful!", options: ["shall", "do", "will", "are"], a: ["shall"] },
        { q: "How ...... going to the cinema?", options: ["about", "to", "for", "do"], a: ["about"] },
        { q: "I don’t really ..... like seeing a film.", options: ["feel", "want", "like", "go"], a: ["feel"] },
        { q: "...... you like to go to the art gallery?", options: ["Would", "Do", "Are", "Will"], a: ["Would"] },
        { q: "That ..... like a good idea. ....... .", options: ["sounds ...... What's on ?", "looks ...... Where ?", "is ...... Fine", "seems ...... Okay"], a: ["sounds ...... What's on ?"] },
        { q: "Today is much .... than yesterday.", options: ["colder", "coldest", "more cold", "cold"], a: ["colder"] },
        { q: "Grace is .... in the class.", options: ["the most intelligent", "more intelligent", "intelligent", "most intelligent"], a: ["the most intelligent"] },
        { q: "Madrid is ...... than London.", options: ["hotter", "hottest", "more hot", "the hottest"], a: ["hotter"] },
        { q: "I got the .... grade in the class.", options: ["worst", "bad", "worse", "the worst"], a: ["worst"] },
        { q: "Spanish is .... to learn than Chinese.", options: ["easier", "easy", "easiest", "more easy"], a: ["easier"] },
        { q: "Shanghai is ..... than Singapore.", options: ["more modern", "most modern", "modern", "modern than"], a: ["more modern"] },
        { q: "Your car is much ...... than mine.", options: ["more expensive", "expensive", "expensiver", "most expensive"], a: ["more expensive"] },
        { q: "Charles de Gaulle is one of ....... airports in the world.", options: ["the busiest", "busiest", "busier", "the busy"], a: ["the busiest"] },
        { q: "Are you ..... of spiders?", options: ["scared", "fear", "scary", "fright"], a: ["scared"] },
        { q: "Well done! You’ve got all your spellings ..... .", options: ["right", "correct", "wrong", "good"], a: ["right"] },
        { q: "J.K. Rowling is a very ..... woman.", options: ["generous", "rich", "mean", "bad"], a: ["generous"] },
        { q: "I ...... my sister. We both have brown eyes.", options: ["look like", "am like", "resemble", "looks"], a: ["look like"] },
        { q: "‘What’s your teacher ___?’ ‘She’s really good.’", options: ["like", "looks", "look like", "is"], a: ["like"] },
        { q: "‘Do you like Fiona?’ ‘___’", options: ["She's OK.", "She is tall.", "She likes me.", "Yes, she is."], a: ["She's OK."] },
        { q: "‘What does your mum like?'", options: ["Gardening and walking.", "She is kind.", "She is tall.", "She looks good."], a: ["Gardening and walking."] },
        { q: "Carol is a very ___ person. I could talk to her all day.", options: ["interesting", "bored", "bad", "mean"], a: ["interesting"] }
    ];

    let currentQ = 0;
    let score = 0;
    let answersState = []; // لتخزين إجابات المستخدم والعودة لها

    function startQuiz() {
        document.getElementById('start-page').classList.add('hidden');
        document.getElementById('quiz-page').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        const data = quizData[currentQ];
        const container = document.getElementById('options-container');
        const qContent = document.getElementById('question-content');
        const noteBox = document.getElementById('note-container');
        const header = document.getElementById('question-header');
        
        container.innerHTML = '';
        header.innerText = `سؤال رقم ${currentQ + 1}`;
        qContent.innerText = data.q;
        
        // التعامل مع الملاحظات
        if (currentQ > 0 && quizData[currentQ-1].note) {
            noteBox.innerText = quizData[currentQ-1].note;
            noteBox.classList.remove('hidden');
        } else {
            noteBox.classList.add('hidden');
        }

        // خلط الخيارات
        let options = [...data.options];
        options.sort(() => Math.random() - 0.5);

        let selectedForMulti = [];

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            
            // استعادة الحالة إذا عاد الطالب للسؤال
            if (answersState[currentQ]) {
                btn.disabled = true;
                if (data.a.includes(opt)) btn.classList.add('correct');
                if (answersState[currentQ].selected.includes(opt) && !data.a.includes(opt)) btn.classList.add('wrong');
            } else {
                btn.onclick = () => {
                    if (data.multi) {
                        // حالة الإجابتين الصحيحتين (12-15)
                        if (selectedForMulti.includes(opt)) return;
                        selectedForMulti.push(opt);
                        if (data.a.includes(opt)) {
                            btn.classList.add('correct');
                        } else {
                            btn.classList.add('wrong');
                        }
                        
                        if (selectedForMulti.length === 2) {
                            checkMulti(selectedForMulti, data.a);
                        }
                    } else {
                        // حالة الإجابة الواحدة
                        if (data.a.includes(opt)) {
                            btn.classList.add('correct');
                            score++;
                        } else {
                            btn.classList.add('wrong');
                            // تظليل الصحيحة
                            Array.from(container.children).forEach(b => {
                                if (data.a.includes(b.innerText)) b.classList.add('correct');
                            });
                        }
                        finalizeAnswer([opt]);
                    }
                };
            }
            container.appendChild(btn);
        });

        document.getElementById('progress-text').innerText = `${currentQ + 1} / 82`;
        document.getElementById('prev-btn').disabled = currentQ === 0;
        document.getElementById('next-btn').classList.add('hidden');
        if (answersState[currentQ]) document.getElementById('next-btn').classList.remove('hidden');
    }

    function checkMulti(selected, correctOnes) {
        let correctCount = 0;
        selected.forEach(s => { if (correctOnes.includes(s)) correctCount++; });
        if (correctCount === 2) score++;
        
        // إظهار كافة الإجابات الصحيحة إذا أخطأ
        const container = document.getElementById('options-container');
        Array.from(container.children).forEach(b => {
            if (correctOnes.includes(b.innerText)) b.classList.add('correct');
        });
        
        finalizeAnswer(selected);
    }

    function finalizeAnswer(selectedArr) {
        answersState[currentQ] = { selected: selectedArr };
        // تعطيل الأزرار
        const container = document.getElementById('options-container');
        Array.from(container.children).forEach(b => b.disabled = true);
        
        // الانتقال التلقائي بعد ثانية واحدة (إلا إذا كان هناك ملاحظة سيقرأها)
        setTimeout(() => {
            if (currentQ < 81) {
                goNext();
            } else {
                showResult();
            }
        }, 1200);
    }

    function goNext() {
        if (currentQ < 81) {
            currentQ++;
            showQuestion();
        } else {
            showResult();
        }
    }

    function goBack() {
        if (currentQ > 0) {
            currentQ--;
            showQuestion();
            document.getElementById('next-btn').classList.remove('hidden');
        }
    }

    function showResult() {
        document.getElementById('quiz-page').classList.add('hidden');
        document.getElementById('result-page').classList.remove('hidden');
        document.getElementById('score-display').innerText = score;
    }
</script>

</body>
</html>
